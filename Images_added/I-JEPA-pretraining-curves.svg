    <text x="396" y="388" text-anchor="middle" class="tick" style="font-size: 13px;">end of warmup</text>
  </g>

  <g transform="translate(1365,80)">
    <text x="250" y="0" text-anchor="middle" class="panel-title">Target-encoder EMA momentum</text>
    <rect x="0" y="25" width="620" height="370" fill="none" stroke="#8a8a8a" stroke-width="1"/>

    <g class="grid">
      <line x1="70" y1="70" x2="570" y2="70"/>
      <line x1="70" y1="120" x2="570" y2="120"/>
      <line x1="70" y1="170" x2="570" y2="170"/>
      <line x1="70" y1="220" x2="570" y2="220"/>
      <line x1="70" y1="270" x2="570" y2="270"/>
      <line x1="70" y1="320" x2="570" y2="320"/>
      <line x1="70" y1="370" x2="570" y2="370"/>
      <line x1="70" y1="70" x2="70" y2="370"/>
      <line x1="120" y1="70" x2="120" y2="370"/>
