    <g class="tick">
      <text x="70" y="390" text-anchor="middle">20</text>
      <text x="170" y="390" text-anchor="middle">40</text>
      <text x="270" y="390" text-anchor="middle">60</text>
      <text x="370" y="390" text-anchor="middle">80</text>
      <text x="470" y="390" text-anchor="middle">100</text>
      <text x="570" y="390" text-anchor="middle">120</text>
      <text x="18" y="374" text-anchor="end">0.100</text>
