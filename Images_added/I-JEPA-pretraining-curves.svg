      <line x1="70" y1="70" x2="70" y2="370"/>
      <line x1="70" y1="370" x2="570" y2="370"/>
      <line x1="570" y1="70" x2="570" y2="370"/>
    </g>

    <path class="area" d="M70,296 L93,254 L116,222 L143,202 L176,191 L208,186 L238,182 L271,176 L296,171 L323,167 L352,164 L382,160 L418,156 L452,152 L488,149 L522,145 L570,142 L570,370 L70,370 Z"/>
