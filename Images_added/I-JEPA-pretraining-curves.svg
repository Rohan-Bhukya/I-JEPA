<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="800" viewBox="0 0 2200 800" role="img" aria-label="I-JEPA pre-training curves">
  <defs>
    <style>
      .title { font: 600 34px 'DejaVu Sans', Arial, sans-serif; fill: #1a1a1a; }
      .panel-title { font: 500 20px 'DejaVu Sans', Arial, sans-serif; fill: #1a1a1a; }
      .axis-label { font: 500 18px 'DejaVu Sans', Arial, sans-serif; fill: #1a1a1a; }
      .tick { font: 400 15px 'DejaVu Sans', Arial, sans-serif; fill: #444; }
      .grid { stroke: #b7b7b7; stroke-width: 1; }
      .axis { stroke: #6c6c6c; stroke-width: 1.2; }
      .line { fill: none; stroke: #1f77b4; stroke-width: 2.5; }
      .area { fill: rgba(31,119,180,0.12); }
      .dash { stroke: #4a4a4a; stroke-width: 1.8; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="2200" height="800" fill="#f4f4f4"/>

  <text x="1100" y="42" text-anchor="middle" class="title">I-JEPA pre-training curves (vit_small, 96x96, patch 8)</text>

  <g transform="translate(35,80)">
    <text x="250" y="0" text-anchor="middle" class="panel-title">Pre-training loss (mean ± std per epoch)</text>
    <rect x="0" y="25" width="620" height="370" fill="none" stroke="#8a8a8a" stroke-width="1"/>

    <g class="grid">
      <line x1="70" y1="70" x2="570" y2="70"/>
      <line x1="70" y1="120" x2="570" y2="120"/>
      <line x1="70" y1="170" x2="570" y2="170"/>
      <line x1="70" y1="220" x2="570" y2="220"/>
      <line x1="70" y1="270" x2="570" y2="270"/>
      <line x1="70" y1="320" x2="570" y2="320"/>
      <line x1="70" y1="370" x2="570" y2="370"/>
      <line x1="70" y1="70" x2="70" y2="370"/>
      <line x1="120" y1="70" x2="120" y2="370"/>
      <line x1="170" y1="70" x2="170" y2="370"/>
      <line x1="220" y1="70" x2="220" y2="370"/>
      <line x1="270" y1="70" x2="270" y2="370"/>
